# Creates and pushes a release tag using the workflow's own token.
#
# Exists because remote Claude Code sessions can push branches (including
# main) but their credentials are denied for refs/tags/* — so the final
# "git push origin vX.Y.Z" step of the release procedure (see CLAUDE.md)
# 403s from those sessions. Local developers don't need this; they can
# push the tag directly.
name: Tag Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.4.11"
        required: true
      ref:
        description: "Commit SHA (or branch) to tag — usually the 'Release vX.Y.Z' commit on main"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Create and push tag
        run: |
          git tag "${{ inputs.tag }}"
          git push origin "refs/tags/${{ inputs.tag }}"
