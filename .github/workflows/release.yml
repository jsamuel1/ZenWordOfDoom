# The one release action: bumps the version via scripts/bump-version.sh,
# commits "Release vX.Y.Z" to main, tags vX.Y.Z, and pushes both — so the
# bump, release commit, and tag can never drift apart or be half-applied.
# See CLAUDE.md "Release procedure".
#
# Pushes made with GITHUB_TOKEN do not trigger other GitHub Actions
# workflows, so the last step dispatches ci.yml on the release commit
# explicitly (with a guard so it can't double-run). External integrations
# subscribed via their own GitHub app — e.g. Xcode Cloud — receive the
# push/tag events directly and pick up the release from there.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  # Needed to dispatch ci.yml on the release commit.
  actions: write

concurrency: release

jobs:
  release:
    # Releases are only ever cut from main; dispatching from another ref
    # is a mistake, so refuse instead of tagging a side branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version
        run: scripts/bump-version.sh "${{ inputs.bump }}"
      - name: Commit, tag, and push
        run: |
          version=$(grep -E '^[[:space:]]*MARKETING_VERSION:' project.yml | head -1 \
            | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if git ls-remote --exit-code origin "refs/tags/v${version}" > /dev/null 2>&1; then
            echo "error: tag v${version} already exists on origin" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${version}"
          git tag "v${version}"
          git push origin main "refs/tags/v${version}"
      - name: Run CI on the release commit
        # GITHUB_TOKEN pushes never trigger on:push workflows, so kick
        # ci.yml explicitly. Two layers keep this from double-running if
        # the push ever DOES trigger CI (e.g. the push credential is
        # switched to a PAT or deploy key someday): skip the dispatch when
        # a CI run already exists for this exact commit, and ci.yml's own
        # per-ref concurrency group (cancel-in-progress) collapses any
        # duplicate that slips through the race window.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          existing=$(gh run list --workflow ci.yml --commit "$sha" --json databaseId --jq 'length')
          if [ "${existing}" -gt 0 ]; then
            echo "CI already has ${existing} run(s) for ${sha} — not dispatching another."
          else
            gh workflow run ci.yml --ref main
            echo "Dispatched ci.yml on main (${sha})."
          fi
