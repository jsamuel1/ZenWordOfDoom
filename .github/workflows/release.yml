name: Build & Publish

# Archives the app, exports a signed .ipa, and uploads it to TestFlight /
# App Store Connect. Triggered by pushing a version tag (v1.2.3) or manually.
#
# This workflow is dormant until an Xcode project and signing are in place: if
# no .xcodeproj/.xcworkspace exists, it logs a notice and exits successfully.
#
# Required configuration before first real publish
# -------------------------------------------------
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   APP_STORE_CONNECT_KEY_ID        App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID     App Store Connect issuer id
#   APP_STORE_CONNECT_KEY_P8        Contents of the .p8 private key
#   BUILD_CERTIFICATE_BASE64        base64 of the distribution .p12
#   P12_PASSWORD                    password for the .p12
#   PROVISIONING_PROFILE_BASE64     base64 of the .mobileprovision
#   KEYCHAIN_PASSWORD               any ephemeral keychain password
# Variables:
#   APP_SCHEME                      Xcode scheme (default: ZenWordOfDoom)
#   APP_BUNDLE_ID                   e.g. com.example.zenwordofdoom

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      lane:
        description: "Publish target"
        type: choice
        default: testflight
        options: [testflight, appstore]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "16.1"

jobs:
  publish:
    name: Archive & upload
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::notice::Xcode ${XCODE_VERSION} not on runner; using default $(xcode-select -p)."
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify signing secrets are configured
        id: proj
        run: |
          if [ -z "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ] \
            || [ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing/App Store Connect secrets are not configured — skipping publish. See docs/CI.md."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing assets
        if: steps.proj.outputs.present == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive
        if: steps.proj.outputs.present == 'true'
        env:
          SCHEME: ${{ vars.APP_SCHEME || 'ZenWordOfDoom' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ZenWordOfDoom.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ZenWordOfDoom.xcarchive" \
            clean archive

      - name: Export .ipa
        if: steps.proj.outputs.present == 'true'
        env:
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZenWordOfDoom.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight / App Store Connect
        if: steps.proj.outputs.present == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          # Provide the API key where xcrun altool / notarytool look for it.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload .ipa artifact
        if: steps.proj.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZenWordOfDoom-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      - name: Clean up keychain
        if: always() && steps.proj.outputs.present == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
