name: Build & Publish

# Archives the app, exports a signed .ipa, and uploads it to TestFlight /
# App Store Connect — using AUTOMATIC (cloud) code signing driven by an
# App Store Connect API key. Xcode fetches/generates the distribution
# certificate and provisioning profile on the fly, so there is no .p12,
# .mobileprovision, or keychain to manage.
#
# Triggered by pushing a version tag (vX.Y.Z) or manually. Dormant until the
# single signing secret below is configured: if absent it logs a warning and
# exits successfully, so tagging is safe before setup.
#
# Configuration (Settings -> Secrets and variables -> Actions)
# ------------------------------------------------------------
# Secret (sensitive — the private key):
#   APP_STORE_CONNECT_KEY_P8     Full text of the AuthKey_XXXX.p8 file
# Variables (non-sensitive identifiers):
#   APP_STORE_CONNECT_KEY_ID     App Store Connect API key id (e.g. YH4RWCPJB6)
#   APP_STORE_CONNECT_ISSUER_ID  App Store Connect issuer id (UUID)
#   APPLE_TEAM_ID                10-char Apple Developer Team ID
#   APP_BUNDLE_ID                e.g. com.yourcompany.zenwordofdoom
#   APP_SCHEME                   Xcode scheme (optional; default ZenWordOfDoom)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      lane:
        description: "Publish target"
        type: choice
        default: testflight
        options: [testflight, appstore]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "16.1"

jobs:
  publish:
    name: Archive & upload
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::notice::Xcode ${XCODE_VERSION} not on runner; using default $(xcode-select -p)."
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check signing secret is configured
        id: gate
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_STORE_CONNECT_KEY_P8 secret / APP_STORE_CONNECT_KEY_ID variable not set — skipping publish. See docs/CI.md."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write App Store Connect API key
        if: steps.gate.outputs.present == 'true'
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          # xcodebuild and altool look for the key in these well-known dirs.
          mkdir -p "$RUNNER_TEMP/keys" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          cp "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
             "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Archive (automatic cloud signing)
        if: steps.gate.outputs.present == 'true'
        env:
          SCHEME: ${{ vars.APP_SCHEME || 'ZenWordOfDoom' }}
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ZenWordOfDoom.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ZenWordOfDoom.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            clean archive

      - name: Export .ipa (automatic signing)
        if: steps.gate.outputs.present == 'true'
        env:
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZenWordOfDoom.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight / App Store Connect
        if: steps.gate.outputs.present == 'true'
        env:
          KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload .ipa artifact
        if: steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZenWordOfDoom-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
