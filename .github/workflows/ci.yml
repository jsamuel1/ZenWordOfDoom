name: CI

# Build and test on every push and pull request.
#  - swift-packages: tests the pure-Swift cores (GameCore, WordEngine).
#  - ios-app: generates the Xcode project with XcodeGen and builds the app
#    for the iOS simulator (compiles + links against the local package).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override via repo Variables if the project pins a different toolchain.
  XCODE_VERSION: "16.1"

jobs:
  swift-packages:
    name: Swift packages (test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::notice::Xcode ${XCODE_VERSION} not on runner; using default $(xcode-select -p)."
          fi
          xcodebuild -version

      - name: swift build & test
        run: swift test --parallel

  ios-app:
    name: iOS app (build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::notice::Xcode ${XCODE_VERSION} not on runner; using default $(xcode-select -p)."
          fi
          xcodebuild -version

      - name: Install tools (XcodeGen, xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iPhone simulator)
        env:
          SCHEME: ${{ vars.APP_SCHEME || 'ZenWordOfDoom' }}
          DESTINATION: "platform=iOS Simulator,name=iPhone 15,OS=latest"
        run: |
          set -o pipefail
          xcodebuild \
            -project ZenWordOfDoom.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify
