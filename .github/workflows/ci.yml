name: CI

# Build and test on every push and pull request.
#  - swift-packages: tests the pure-Swift cores (GameCore, WordEngine).
#  - ios-app: generates the Xcode project with XcodeGen and builds the app
#    for the iOS simulator (compiles + links against the local package).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override via repo Variables if the project pins a different toolchain.
  XCODE_VERSION: "26.5"

jobs:
  swift-packages:
    name: Swift packages (test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::notice::Xcode ${XCODE_VERSION} not on runner; using default $(xcode-select -p)."
          fi
          xcodebuild -version

      - name: swift build & test
        run: swift test --parallel

  ios-app:
    name: iOS app (build & test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::notice::Xcode ${XCODE_VERSION} not on runner; using default $(xcode-select -p)."
          fi
          xcodebuild -version

      - name: Install tools (XcodeGen, xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test (iOS simulator)
        env:
          SCHEME: ${{ vars.APP_SCHEME || 'ZenWordOfDoom' }}
        run: |
          set -o pipefail
          # Running the App-target unit tests needs a concrete simulator (a
          # generic destination can only build). Pick an eligible iPhone by
          # UDID from `-showdestinations` — it only lists destinations valid
          # for this scheme's deployment target, so we skip simulators on
          # older runtimes and don't hardcode a device name that shifts
          # between Xcode versions.
          UDID=$(xcodebuild \
            -project ZenWordOfDoom.xcodeproj \
            -scheme "$SCHEME" \
            -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | grep -v placeholder \
            | grep -oE 'id:[0-9A-Fa-f-]+' \
            | head -1 | cut -d: -f2)
          if [ -z "$UDID" ]; then
            echo "::error::No eligible iPhone simulator for the ZenWordOfDoom scheme."
            exit 1
          fi
          echo "Using simulator UDID: $UDID"
          xcodebuild \
            -project ZenWordOfDoom.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            clean test \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify
