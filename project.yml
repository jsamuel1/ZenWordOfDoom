# XcodeGen spec — the .xcodeproj is generated from this file (CI runs
# `xcodegen generate`), so we never commit a fragile hand-written pbxproj.
# Locally: `brew install xcodegen && xcodegen generate && open ZenWordOfDoom.xcodeproj`
name: ZenWordOfDoom

options:
  bundleIdPrefix: wtf.sauhsoj
  # iOS 26.5 is the newest SDK available on GitHub's macos-26 runner
  # (Xcode 26.5/26.6 both top out at the iOS 26.5 SDK), so it is the
  # highest deployment target CI can build. Keep this in lockstep with
  # XCODE_VERSION in .github/workflows.
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true

# Whenever a package here is added/changed, update ci_scripts/Package.resolved
# to match (see ci_scripts/ci_post_clone.sh for why it's hand-maintained).
packages:
  ZenWordOfDoomKit:
    path: .
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0

targets:
  ZenWordOfDoom:
    type: application
    platform: iOS
    sources:
      - path: App/ZenWordOfDoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wtf.sauhsoj.zenwordofdoom
        DEVELOPMENT_TEAM: SL6CE3V9L5
        CODE_SIGN_IDENTITY: "iPhone Developer"
        # Bump per release with scripts/bump-version.sh [patch|minor|major]
        # (defaults to patch). CURRENT_PROJECT_VERSION is the build number and
        # is incremented on every release — TestFlight rejects re-used builds.
        MARKETING_VERSION: "0.4.3"
        CURRENT_PROJECT_VERSION: "12"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/ZenWordOfDoom/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.word-games"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: ZenWordOfDoomKit
        product: GameCore
      - package: ZenWordOfDoomKit
        product: LevelGen
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform

  # Unit tests for App-layer logic (the pure cores are tested via `swift test`).
  # Hosted by the app target so `@testable import ZenWordOfDoom` can reach
  # internal types like BundledVisuals.
  ZenWordOfDoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/ZenWordOfDoomTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wtf.sauhsoj.zenwordofdoom.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: ZenWordOfDoom
      - package: ZenWordOfDoomKit
        product: LevelGen

  # iOS 17 accessibility audit UI tests (performAccessibilityAudit) across the
  # app's key screens. See App/ZenWordOfDoomUITests/AccessibilityAuditTests.swift.
  ZenWordOfDoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/ZenWordOfDoomUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wtf.sauhsoj.zenwordofdoom.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: ZenWordOfDoom

schemes:
  ZenWordOfDoom:
    build:
      targets:
        ZenWordOfDoom: all
        ZenWordOfDoomTests: [test]
        ZenWordOfDoomUITests: [test]
    run:
      config: Debug
      # Local StoreKit testing: fake-money purchases in the simulator.
      storeKitConfiguration: App/ZenWordOfDoom/Products.storekit
    test:
      config: Debug
      targets:
        - ZenWordOfDoomTests
        - ZenWordOfDoomUITests
    archive:
      config: Release
