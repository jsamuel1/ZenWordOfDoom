# XcodeGen spec — the .xcodeproj is generated from this file (CI runs
# `xcodegen generate`), so we never commit a fragile hand-written pbxproj.
# Locally: `brew install xcodegen && xcodegen generate && open ZenWordOfDoom.xcodeproj`
name: ZenWordOfDoom

options:
  bundleIdPrefix: wtf.sauhsoj
  # iOS 26.5 is the newest SDK available on GitHub's macos-26 runner
  # (Xcode 26.5/26.6 both top out at the iOS 26.5 SDK), so it is the
  # highest deployment target CI can build. Keep this in lockstep with
  # XCODE_VERSION in .github/workflows.
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true

packages:
  ZenWordOfDoomKit:
    path: .

targets:
  ZenWordOfDoom:
    type: application
    platform: iOS
    sources:
      - path: App/ZenWordOfDoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wtf.sauhsoj.zenwordofdoom
        DEVELOPMENT_TEAM: SL6CE3V9L5
        CODE_SIGN_IDENTITY: "iPhone Developer"
        # Bump per release with scripts/bump-version.sh [patch|minor|major]
        # (defaults to patch). CURRENT_PROJECT_VERSION is the build number and
        # is incremented on every release — TestFlight rejects re-used builds.
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/ZenWordOfDoom/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.word-games"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: ZenWordOfDoomKit
        product: GameCore
      - package: ZenWordOfDoomKit
        product: WordEngine
      - package: ZenWordOfDoomKit
        product: LevelKit
      - package: ZenWordOfDoomKit
        product: LevelGen

schemes:
  ZenWordOfDoom:
    build:
      targets:
        ZenWordOfDoom: all
    run:
      config: Debug
      # Local StoreKit testing: fake-money purchases in the simulator.
      storeKitConfiguration: App/ZenWordOfDoom/Products.storekit
    archive:
      config: Release
